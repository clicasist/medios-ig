<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Puente de archivos</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 28px; background: #0e203a; color: #eaf0f8; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  p  { font-size: 13px; opacity: .72; margin: 0 0 18px; }
  #estado { font: 12px/1.65 ui-monospace, Consolas, monospace; white-space: pre; }
  .ok   { color: #8fe3a8; }
  .mal  { color: #ff9a9a; }
</style>

<h1>Puente de archivos</h1>
<p>Esta pagina solo pasa los archivos a la pestana que la abrio. No sale nada a internet.</p>
<div id="estado">preparando...</div>

<script>
// Meta bloquea por CSP cualquier descarga desde su propia pagina: ni fetch, ni
// imagenes. Pero NO puede bloquear postMessage entre ventanas. Asi que esta
// pagina, que si puede leer sus propios archivos, se los entrega a la de Meta.
const salida = document.getElementById('estado');
const linea = (t, c) => {
  const d = document.createElement('div');
  if (c) d.className = c;
  d.textContent = t;
  salida.appendChild(d);
};

const destino = window.opener;

async function correr() {
  salida.textContent = '';
  if (!destino) { linea('sin ventana de destino: abrame desde la pagina de Meta', 'mal'); return; }

  const filtro = decodeURIComponent(location.hash.slice(1));   // '', 'mp4' o 'png'
  const lista = (await (await fetch('manifiesto.json')).json())
                  .filter(r => !filtro || r.endsWith(filtro));

  linea('archivos por pasar: ' + lista.length);
  let n = 0, bytes = 0;
  for (const ruta of lista) {
    try {
      const r = await fetch(ruta);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const buf = await r.arrayBuffer();
      bytes += buf.byteLength;
      // El buffer se TRANSFIERE (no se copia): es mucho mas rapido y no
      // duplica 46 MB en memoria.
      destino.postMessage({ t: 'archivo', ruta: ruta, buf: buf }, '*', [buf]);
      n++;
      linea('  ' + ruta, 'ok');
    } catch (e) {
      linea('  ' + ruta + ' -> ' + e.message, 'mal');
    }
  }
  destino.postMessage({ t: 'fin', total: n, bytes: bytes }, '*');
  linea('');
  linea('listo: ' + n + ' de ' + lista.length + '  (' + (bytes / 1048576).toFixed(1) + ' MB)', 'ok');
}

correr();
</script>
</html>
